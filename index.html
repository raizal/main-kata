<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Main Kata</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f5c6d6'/%3E%3Ctext x='90' y='128' font-family='system-ui,sans-serif' font-size='110' font-weight='800' text-anchor='middle' fill='%233e3a36'%3EA%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:#faf7f2;
    font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:manipulation;
  }

  /* ---- Board: 26 Letter Boxes, 4x7, always fits, never scrolls ---- */
  #board{
    position:fixed;inset:0;display:grid;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);
    gap:2.2vmin;padding:calc(2.6vmin + env(safe-area-inset-top)) 2.6vmin
          calc(2.6vmin + env(safe-area-inset-bottom));
  }
  .box{
    border:0;border-radius:22%;display:grid;place-items:center;
    /* Longhands, not the `font:` shorthand — `inherit` is only legal as a
       whole value, so `font:800 …/1 inherit` is dropped and buttons fall
       back to the 13px UA default. */
    font-family:inherit;font-weight:800;font-size:min(9.5vmin,10vh);
    line-height:1;color:#3e3a36;
    box-shadow:0 .5vmin 0 rgba(0,0,0,.06);cursor:pointer;
    transition:transform .12s ease;
  }
  .box:active{transform:scale(.94)}
  .box[data-pos="y"]{grid-column:2}

  /* pastel Colour Groups */
  .pink{background:#f5c6d6}  .blue{background:#bcdaec}
  .yellow{background:#f7e6a4}.brown{background:#ddc6b1}
  .orange{background:#f8cda6}.purple{background:#d6c6e8}

  /* ---- Reveal: fullscreen, one object, nothing competing ---- */
  #reveal{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;
  }
  #reveal.on{display:flex}
  #stage{
    position:absolute;inset:0;display:grid;place-items:center;
    padding:14vmin 4vmin 18vmin;cursor:pointer;
  }
  #photo{
    max-width:100%;max-height:100%;object-fit:contain;
    border-radius:4vmin;opacity:0;transition:opacity .18s ease;
    box-shadow:0 1vmin 4vmin rgba(0,0,0,.12);
  }
  #photo.shown{opacity:1}
  #word{
    position:absolute;left:0;right:0;
    bottom:calc(4vmin + env(safe-area-inset-bottom));
    text-align:center;font-family:inherit;font-weight:800;
    font-size:min(11vmin,7vh);line-height:1;
    color:#3e3a36;letter-spacing:.02em;pointer-events:none;
  }
  #back{
    position:absolute;left:3vmin;top:calc(3vmin + env(safe-area-inset-top));
    width:16vmin;height:16vmin;min-width:60px;min-height:60px;
    border:0;border-radius:50%;background:rgba(255,255,255,.92);
    box-shadow:0 .6vmin 2vmin rgba(0,0,0,.18);
    font-family:inherit;font-weight:700;font-size:8vmin;line-height:1;
    color:#3e3a36;cursor:pointer;z-index:2;
  }
  #back:active{transform:scale(.92)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="board"></div>

<div id="reveal">
  <div id="stage"><img id="photo" alt=""></div>
  <div id="word"></div>
  <button id="back" aria-label="Kembali">&#8592;</button>
</div>

const TINT = {pink:"#fdeff4",blue:"#eef6fb",yellow:"#fdf7e6",
              brown:"#f7f0e9",orange:"#fdf1e6",purple:"#f4effa"};

const board  = document.getElementById("board");
const reveal = document.getElementById("reveal");
const stage  = document.getElementById("stage");
const photo  = document.getElementById("photo");
const wordEl = document.getElementById("word");

let current = null, shownIdx = -1;

/* ---- Build the Board ---- */
for (const [letter, word, colour] of LETTERS) {
  const b = document.createElement("button");
  b.className = "box " + colour;
  b.textContent = letter;
  b.setAttribute("aria-label", word);
  if (letter === "Y") b.dataset.pos = "y";
  b.addEventListener("click", () => open(letter, word, colour));
  board.appendChild(b);
}

function pool(letter){ return (POOLS[letter] && POOLS[letter].length) ? POOLS[letter] : []; }

/* Pick a different photo than the one already showing, so every tap
   is a fresh object — that is what drives the repetitions. */
function pick(letter){
  const p = pool(letter);
  if (!p.length) return -1;
  if (p.length === 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * p.length); } while (i === shownIdx);
  return i;
}

function show(letter){
  const p = pool(letter), i = pick(letter);
  photo.classList.remove("shown");
  if (i < 0){ photo.removeAttribute("src"); return; }   // no pool: word alone
  shownIdx = i;
  photo.src = p[i];
  // warm the next one so the following tap is instant
  if (p.length > 1) new Image().src = p[(i + 1) % p.length];
}

function open(letter, word, colour){
  current = letter; shownIdx = -1;
  wordEl.textContent = word;
  reveal.style.background = TINT[colour];
  reveal.classList.add("on");
  show(letter);
}

function close(){
  reveal.classList.remove("on");
  photo.classList.remove("shown");
  current = null;
}

photo.addEventListener("load",  () => photo.classList.add("shown"));
/* Never show a broken-image icon — fall back silently to the word alone. */
photo.addEventListener("error", () => { photo.classList.remove("shown"); photo.removeAttribute("src"); });

stage.addEventListener("click", () => { if (current) show(current); });
document.getElementById("back").addEventListener("click", e => { e.stopPropagation(); close(); });

/* Kill the ways a five-year-old accidentally leaves the app */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

/* Warm the first photo of every letter at launch so the first tap of
   each object never shows an empty screen. */
addEventListener("load", () => {
  for (const [letter] of LETTERS){
    const p = pool(letter);
    if (p.length) new Image().src = p[0];
  }
});

/* Inline manifest keeps this a single file while still allowing
   Add to Home Screen -> fullscreen, portrait-locked. */
const manifest = {
  name:"Main Kata", short_name:"Main Kata",
  start_url:".", display:"standalone", orientation:"portrait",
  background_color:"#faf7f2", theme_color:"#faf7f2",
  icons:[{src:document.querySelector('link[rel="apple-touch-icon"]').href,
          sizes:"180x180", type:"image/svg+xml", purpose:"any"}]
};
const link = document.createElement("link");
link.rel = "manifest";
link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
document.head.appendChild(link);
</script>
