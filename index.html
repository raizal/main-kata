<html lang="id">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Duolingo style reference. One family throughout: this app has almost no
     copy — 26 letters, two tab labels, one word — so Nunito covers both the
     rounded display voice and the nav labels, and weight does the rest. The
     rounded system stack stays behind it as a fallback. */
  :root{
    --color-eager-green:#58cc02;
    --color-spark-blue:#1cb0f6;
    --color-paper-white:#ffffff;
    --color-charcoal:#4b4b4b;
    --color-pencil-gray:#777777;
    --color-faded-gray:#afafaf;
    --font-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    --text-nav-label:15px;
    --tracking-nav-label:.053em;
    --radius:12px;
    --border:2px;
    --element-gap:12px;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:var(--color-paper-white);
    font-family:var(--font-display);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:manipulation;
  }

  /* ---- Home: theme selector above the board, both always on screen ---- */
  #home{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(2.6vmin + env(safe-area-inset-top)) 2.6vmin
            calc(2.6vmin + env(safe-area-inset-bottom));
  }

  /* Nav Language Pill: ghost by default, 2px faded-gray border, uppercase
     nav-label tracking. The selected tab takes the Primary CTA treatment —
     solid Eager Green, white text, no border — so "where am I" reads as
     "go". It is still the grown-up's control and still small. */
  #picker{display:flex;gap:var(--element-gap);justify-content:center;padding-bottom:var(--element-gap)}
  .tab{
    border:var(--border) solid var(--color-faded-gray);border-radius:var(--radius);
    padding:8px 16px;background:transparent;cursor:pointer;
    font-family:inherit;font-weight:700;
    font-size:var(--text-nav-label);line-height:1.33;
    text-transform:uppercase;letter-spacing:var(--tracking-nav-label);
    color:var(--color-pencil-gray);
  }
  .tab.on{
    border-color:var(--color-eager-green);background:var(--color-eager-green);
    color:var(--color-paper-white);
  }

  /* ---- Board: 26 Letter Boxes, 4x7, always fits, never scrolls ---- */
  #board{
    flex:1;min-height:0;display:grid;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);
    gap:2.2vmin;
  }
  /* Stickers pressed onto the paper: flat fill, 2px border in a deeper tone
     of the same hue, 12px radius, no shadow. */
  .box{
    border:var(--border) solid;border-radius:var(--radius);
    display:grid;place-items:center;
    /* Longhands, not the `font:` shorthand — `inherit` is only legal as a
       whole value, so `font:800 …/1 inherit` is dropped and buttons fall
       back to the 13px UA default. */
    font-family:inherit;font-weight:800;font-size:min(9.5vmin,10vh);
    line-height:1;letter-spacing:-.02em;color:var(--color-charcoal);
    cursor:pointer;transition:transform .12s ease;
  }
  .box:active{transform:scale(.94)}
  .box[data-pos="y"]{grid-column:2}

  /* Suhyung's six Colour Groups, restyled as sticker fills. None of the six
     is green, so Eager Green stays reserved for UI chrome as the reference
     asks — the board never competes with the tabs or the word. */
  .pink  {background:#ffc9dd;border-color:#f08bb4}
  .blue  {background:#b8e2fb;border-color:#1cb0f6}
  .yellow{background:#ffe8a3;border-color:#ffc800}
  .brown {background:#e8d3bd;border-color:#c69c6d}
  .orange{background:#ffd3a8;border-color:#ff9600}
  .purple{background:#ddd0f5;border-color:#a560f0}

  /* ---- Reveal: fullscreen, one object, nothing competing ---- */
  #reveal{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;
    background:var(--color-paper-white);
  }
  #reveal.on{display:flex}
  #stage{
    position:absolute;inset:0;display:grid;place-items:center;
    padding:14vmin 4vmin 18vmin;cursor:pointer;
  }
  #photo{
    max-width:100%;max-height:100%;object-fit:contain;
    border:var(--border) solid var(--color-faded-gray);border-radius:var(--radius);
    opacity:0;transition:opacity .18s ease;
  }
  #photo.shown{opacity:1}

  /* The Section Headline of this page: the one thing she is here to say,
     in the display voice and the signature green. */
  #word{
    position:absolute;left:0;right:0;
    bottom:calc(4vmin + env(safe-area-inset-bottom));
    text-align:center;font-family:inherit;font-weight:800;
    font-size:min(12vmin,7.5vh);line-height:1.2;
    color:var(--color-eager-green);letter-spacing:-.02em;pointer-events:none;
  }

  /* Outlined Account Button treatment — ghost fill, Spark Blue glyph, 2px
     faded-gray border — held at 60px minimum so it stays a five-year-old's
     target rather than a 15px nav control. */
  #back{
    position:absolute;left:3vmin;top:calc(3vmin + env(safe-area-inset-top));
    width:16vmin;height:16vmin;min-width:60px;min-height:60px;
    border:var(--border) solid var(--color-faded-gray);border-radius:var(--radius);
    background:var(--color-paper-white);
    font-family:inherit;font-weight:700;font-size:8vmin;line-height:1;
    color:var(--color-spark-blue);cursor:pointer;z-index:2;
  }
  #back:active{transform:scale(.92)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home">

<div id="reveal">
  <div id="stage"><img id="photo" alt=""></div>
  <div id="word"></div>
  <button id="back" aria-label="Kembali">&#8592;</button>
</div>

/*POOLS_END*/

const board  = document.getElementById("board");
const picker = document.getElementById("picker");
const reveal = document.getElementById("reveal");
const stage  = document.getElementById("stage");
const photo  = document.getElementById("photo");
const wordEl = document.getElementById("word");

let current = null, shownIdx = -1, theme = "benda";

/* Remember which theme she was last playing, so reopening the app from
   the home screen puts her straight back where she was. */
const SAVED = "rere.theme";
try { if (THEMES[localStorage.getItem(SAVED)]) theme = localStorage.getItem(SAVED); }
catch (e) { /* private mode: just start on benda */ }

/* ---- Theme selector, on the home screen above the board ---- */
for (const [name, t] of Object.entries(THEMES)) {
  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = t.label;
  b.dataset.theme = name;
  b.addEventListener("click", () => setTheme(name));
  picker.appendChild(b);
}

/* ---- Build the Board ---- */
function buildBoard(){
  board.textContent = "";
  for (const [letter, word] of THEMES[theme].letters) {
    const b = document.createElement("button");
    b.className = "box " + COLOURS[letter];
    b.textContent = letter;
    b.setAttribute("aria-label", word);
    if (letter === "Y") b.dataset.pos = "y";
    b.addEventListener("click", () => open(letter, word));
    board.appendChild(b);
  }
  for (const tab of picker.children)
    tab.classList.toggle("on", tab.dataset.theme === theme);
}

function setTheme(name){
  if (name === theme) return;
  theme = name;
  try { localStorage.setItem(SAVED, name); } catch (e) {}
  buildBoard();
  warm();
}

function pool(letter){
  const p = POOLS[theme] && POOLS[theme][letter];
  return (p && p.length) ? p : [];
}

/* Pick a different photo than the one already showing, so every tap
   is a fresh object — that is what drives the repetitions. */
function pick(letter){
  const p = pool(letter);
  if (!p.length) return -1;
  if (p.length === 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * p.length); } while (i === shownIdx);
  return i;
}

function show(letter){
  const p = pool(letter), i = pick(letter);
  photo.classList.remove("shown");
  if (i < 0){ photo.removeAttribute("src"); return; }   // no pool: word alone
  shownIdx = i;
  photo.src = p[i];
  // warm the next one so the following tap is instant
  if (p.length > 1) new Image().src = p[(i + 1) % p.length];
}

/* The reveal is pure white now, not a wash of the letter's colour — the
   style reference puts every surface on paper white. Her colour cue lives
   on the board, which is the screen she navigates by. */
function open(letter, word){
  current = letter; shownIdx = -1;
  wordEl.textContent = word;
  reveal.classList.add("on");
  show(letter);
}

function close(){
  reveal.classList.remove("on");
  photo.classList.remove("shown");
  current = null;
}

photo.addEventListener("load",  () => photo.classList.add("shown"));
/* Never show a broken-image icon — fall back silently to the word alone. */
photo.addEventListener("error", () => { photo.classList.remove("shown"); photo.removeAttribute("src"); });

stage.addEventListener("click", () => { if (current) show(current); });
document.getElementById("back").addEventListener("click", e => { e.stopPropagation(); close(); });

/* Kill the ways a five-year-old accidentally leaves the app */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

/* Warm the first photo of every letter so the first tap of each object
   never shows an empty screen — at launch, and again on a theme switch
   because the new theme's photos have never been fetched. */
function warm(){
  for (const [letter] of THEMES[theme].letters){
    const p = pool(letter);
    if (p.length) new Image().src = p[0];
  }
}

buildBoard();
addEventListener("load", warm);

/* Inline manifest keeps this a single file while still allowing
   Add to Home Screen -> fullscreen, portrait-locked. */
const manifest = {
  name:"Main Kata", short_name:"Main Kata",
  start_url:".", display:"standalone", orientation:"portrait",
  background_color:"#ffffff", theme_color:"#ffffff",
  icons:[{src:document.querySelector('link[rel="apple-touch-icon"]').href,
          sizes:"180x180", type:"image/svg+xml", purpose:"any"}]
};
const link = document.createElement("link");
link.rel = "manifest";
link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
document.head.appendChild(link);
