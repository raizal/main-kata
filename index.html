<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Main Kata</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237a9b7e'/%3E%3Ctext x='90' y='128' font-family='Nunito,system-ui,sans-serif' font-size='110' font-weight='800' text-anchor='middle' fill='%23faf8f5'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* Menu: empat pintu, semuanya kelihatan sekaligus.

     2x2 tetap, tidak berubah jadi satu kolom di layar sempit. Tata letak
     yang berpindah menurut lebar layar berarti menu ini kelihatan berbeda
     di ponsel dan di tablet, dan "di mana tombol menulis" jadi pertanyaan
     baru setiap kali. Empat kartu di 2x2 sudah cukup besar di ponsel
     tersempit dan tidak pernah perlu digulung. */
  #menu{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:12px;
  }

  .pintu{
    min-width:0;min-height:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4%;
    padding:6% 8%;
    border:var(--border) solid;border-radius:var(--radius);
    text-decoration:none;color:var(--tinta);
    font-family:inherit;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .pintu:active{transform:scale(.97)}

  /* Gambarnya garis, bukan bidang penuh warna: satu kartu berisi bidang
     warna besar akan menarik mata lebih kuat daripada tiga lainnya, dan
     pilihan jadi tidak setara. */
  .pintu svg{
    width:38%;height:auto;max-height:44%;
    display:block;flex:none;
    stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
    opacity:.75;
  }

  .pintu span{
    font-weight:800;
    font-size:min(4.6vw,17px);
    line-height:1.25;text-align:center;
    letter-spacing:-.01em;
  }

  /* Judul aplikasi ditahan kecil dan tenang. Ini penanda buat orang tua
     bahwa halamannya sudah terbuka, bukan sesuatu yang perlu dia baca. */
  .kepala h1{color:var(--tinta-lembut);font-size:16px;font-weight:700}
</style>
</head>
<body>

<div class="layar">
  <div class="kepala"><h1>Main Kata</h1></div>
  <div id="menu">

    <a class="pintu blue" href="tulis.html">
      <!-- pensil -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4L20 8a2.83 2.83 0 0 0-4-4L4 16v4z"/><path d="M14 6l4 4"/>
      </svg>
      <span>Belajar<br>Menulis</span>
    </a>

    <a class="pintu yellow" href="baca.html">
      <!-- buku terbuka -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v13C8.5 17.5 10.5 18 12 19.5"/>
        <path d="M12 6.5C13.5 5 15.5 4.5 20 4.5v13c-4.5 0-6.5.5-8 2"/>
        <path d="M12 6.5v13"/>
      </svg>
      <span>Belajar<br>Membaca</span>
    </a>

    <a class="pintu orange" href="hewan.html">
      <!-- kucing -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 10 4 4.5l4.2 2.6a9.4 9.4 0 0 1 7.6 0L20 4.5 19.5 10"/>
        <path d="M4.5 10a7.5 7.5 0 0 0 15 0"/>
        <path d="M9.5 12h.01"/><path d="M14.5 12h.01"/>
        <path d="M12 14.8v1.4"/><path d="M10.2 17.4a2.4 2.4 0 0 0 3.6 0"/>
      </svg>
      <span>Mengenal<br>Hewan</span>
    </a>

    <a class="pintu purple" href="benda.html">
      <!-- cangkir dan sendok -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/>
        <path d="M16 10h1.8a2.6 2.6 0 0 1 0 5.2H16"/>
        <path d="M7 5V3.4"/><path d="M11 5V3.4"/>
      </svg>
      <span>Mengenal<br>Benda</span>
    </a>

  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/waktu.js"></script>
</body>
</html>
