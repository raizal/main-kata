<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Belajar Menulis</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237a9b7e'/%3E%3Ctext x='90' y='128' font-family='Nunito,system-ui,sans-serif' font-size='110' font-weight='800' text-anchor='middle' fill='%23faf8f5'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/tulis.css">
</head>
<body>

<div class="layar">
  <div class="kepala">
    <a class="bulat" href="index.html" aria-label="Kembali ke menu" id="kemenu"></a>
    <h1>Belajar Menulis</h1>
    <button class="bulat" id="gir" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
    </button>
  </div>
  <div class="papan" id="papan"></div>
</div>

<div id="tulis">
  <div id="atas">
    <button class="bulat" id="pulang" aria-label="Kembali"></button>
    <button class="bulat" id="ulangi" aria-label="Ulangi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1"/><path d="M3 6v5h5"/>
      </svg>
    </button>
    <button class="bulat" id="bunyi" aria-label="Suara"></button>
  </div>
  <img id="foto" alt="">
  <div id="kata"></div>
  <div id="kotak">
    <div id="bidang">
      <svg id="panduan" viewBox="0 0 100 100"></svg>
      <canvas id="coret"></canvas>
      <div id="centang" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>
      </div>
    </div>
  </div>
</div>

<div id="atur">
  <div class="panel">
    <h2>Pengaturan</h2>
    <div class="baris"><span>Suara</span><div class="pilih" data-kunci="suara">
      <button data-v="nyala">Nyala</button><button data-v="mati">Mati</button></div></div>
    <div class="baris"><span>Tulis</span><div class="pilih" data-kunci="mode">
      <button data-v="huruf">Huruf awal</button><button data-v="kata">Satu kata</button></div></div>
    <div class="baris"><span>Bantuan</span><div class="pilih" data-kunci="bantu">
      <button data-v="mudah">Mudah</button><button data-v="sedang">Sedang</button>
      <button data-v="sulit">Sulit</button></div></div>
    <button id="tutupatur">Selesai</button>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>el("kemenu").innerHTML = PANAH; el("pulang").innerHTML = PANAH;</script>
<script src="assets/tulis.js"></script>
</body>
</html>
